<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0"
    />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>FieldShore</title>
    <script>
      // Pre-paint theme apply — runs before first paint so a stored preference
      // never flashes the default dark frame. ThemeProvider (theme.tsx) owns
      // [data-theme] from mount onward; this only seeds the very first paint.
      try {
        var t = localStorage.getItem('fieldshore_theme');
        if (t === 'system')
          t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        if (t) document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        /* storage unavailable — keep the data-theme="dark" default */
      }
    </script>
    <script>
      // First visit → the public welcome page (Alex, 2026-07-13; amends J-21).
      // Only the bare root cold-open redirects — deep links (magic-link /auth,
      // invite joins, tab URLs) always reach the app, and any app load marks
      // the browser as entered. Welcome's "Open FieldShore" CTAs set the same
      // flag so the bounce never loops.
      try {
        if (!localStorage.getItem('fieldshore_entered')) {
          if (location.pathname === '/') location.replace('/welcome.html');
          else localStorage.setItem('fieldshore_entered', '1');
        }
      } catch (e) {
        /* storage unavailable — never trap on marketing, load the app */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
