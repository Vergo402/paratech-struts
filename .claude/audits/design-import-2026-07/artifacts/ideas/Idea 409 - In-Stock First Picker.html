<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>#409 — Sort in-stock connectors to top of deduction picker</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="exploration-chrome.css">
<script src="_vendor/react.js"></script>
<script src="exploration-quiet.js"></script>
<script src="_vendor/react-dom.js"></script>
<script src="_ds_bundle.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { VisualGridPicker, PlateSwatch, InlineSegmented, MeasurementValue, Segmented } = window.FieldShore;
const { useState, useEffect } = React;

// Mirrors BASE_PLATES in fieldshore-v4 core (subset used by this crew).
const PARTS = [
  { id: 'multi',        name: 'Multi-Base',                    height: 4.2 },
  { id: 'swivel6',      name: '6" Swivel Base',                height: 1.8 },
  { id: 'swivel12',     name: '12" Swivel Base',               height: 2.3 },
  { id: 'rigid6',       name: '6" Rigid Base',                 height: 1.0 },
  { id: 'rigid12',      name: '12" Rigid Base',                height: 1.2 },
  { id: 'hinged6',      name: '6" Hinged Base',                height: 3.2 },
  { id: 'hinged12',     name: '12" Hinged Base',               height: 3.4 },
  { id: 'base45',       name: '45° Base',                      height: 5.4 },
  { id: 'vbase',        name: 'V-Base',                        height: 1.9 },
  { id: 'contour',      name: 'Contour Base',                  height: 1.7 },
  { id: 'threadedconn', name: 'Adjustable Threaded Connector', height: 3.5 },
  { id: 'springloaded', name: 'Spring Loaded Connector',       height: 3.9 },
];
const WOOD = [
  { id: 'none', h: 0 }, { id: '4x4', h: 3.5 }, { id: '6x6', h: 5.5 },
];
const WOOD_OPTIONS = WOOD.map((w) => ({ value: w.id, label: w.id === 'none' ? 'None' : w.id.replace('x', '×') }));

const OPTIONS = [
  { id: 'none', name: 'None' },
  ...PARTS.map((p) => ({ id: p.id, name: p.name, sub: <MeasurementValue eighths={-Math.round(p.height * 8)} /> })),
];

// What each rig actually carries (drives availableIds).
const RIGS = {
  rescue1: { label: 'Rescue 1', stock: ['multi', 'swivel6', 'rigid6', 'vbase'] },
  engine7: { label: 'Engine 7', stock: ['multi', 'hinged6', 'hinged12', 'base45', 'contour', 'threadedconn'] },
  all:     { label: 'No filter (today)', stock: null },
};

const plateH = (id) => (PARTS.find((p) => p.id === id) || { height: 0 }).height;
const woodH = (id) => (WOOD.find((w) => w.id === id) || { h: 0 }).h;

// Photos are the Paratech manual figures in plates/<id>.png (same set v3
// shipped). Same fallback pattern as the shipped PlateThumb.
function PhotoThumb({ opt }) {
  const [err, setErr] = useState(false);
  if (opt.id === 'none' || err) return <PlateSwatch name={opt.name} />;
  return (
    <img
      className="fs-swatch fs-swatch--photo"
      src={'plates/' + opt.id + '.png'}
      alt=""
      aria-hidden="true"
      onError={() => setErr(true)}
    />
  );
}

function Page() {
  const [rig, setRig] = useState('rescue1');
  const [value, setValue] = useState({ headerWood: '4x4', footerWood: 'none', topPlate: 'multi', bottomPlate: 'swivel6' });
  const raw = 749; // 93 5/8" opening
  const set = (k, v) => setValue((prev) => ({ ...prev, [k]: v }));

  const stock = RIGS[rig].stock;
  const availableIds = stock ? new Set(stock) : undefined;
  const deductions = woodH(value.headerWood) + woodH(value.footerWood) + plateH(value.topPlate) + plateH(value.bottomPlate);
  const effectiveEighths = raw - Math.round(deductions * 8);
  const offTruck = ['topPlate', 'bottomPlate'].filter((k) => stock && value[k] !== 'none' && !stock.includes(value[k]));

  const platePicker = (label, key) => (
    <VisualGridPicker
      label={label}
      options={OPTIONS}
      value={value[key]}
      onSelect={(id) => set(key, id)}
      availableIds={availableIds}
      renderThumb={(opt) => <PhotoThumb opt={opt} />}
      trailing={<span className="fs-ledger-value"><MeasurementValue eighths={-Math.round(plateH(value[key]) * 8)} /></span>}
    />
  );

  return (
    <div className="xp-page">
      <header className="xp-head">
        <span className="xp-eyebrow">FieldShore v4 · design exploration</span>
        <h1 className="xp-title">#409 — Deduction picker: in-stock parts first</h1>
        <p className="xp-sub">
          In the field, the connector on the truck is the one that matters. The picker sorts
          parts in inventory to the top under an “Available” header; everything else drops below,
          greyed but still selectable — mutual aid happens.
        </p>
        <nav className="xp-links">
          <a href="Design Exploration Queue.html">← All explorations</a>
          <a href="https://github.com/Vergo402/paratech-struts/issues/409" target="_blank" rel="noopener">Issue #409 ↗</a>
        </nav>
      </header>

      <div className="xp-toolbar">
        <span className="xp-toolbar-label">Assigned apparatus</span>
        <Segmented
          size="standard"
          options={Object.entries(RIGS).map(([v, r]) => ({ value: v, label: r.label }))}
          value={rig}
          onChange={setRig}
          aria-label="Assigned apparatus"
        />
      </div>

      <div className="xp-row">
        <section className="xp-panel" style={{ width: 400 }}>
          <span className="xp-tag">Proposed · tap a plate picker</span>
          <div className="xp-panel-head">
            <h2 className="xp-panel-title">Strut deduction ledger</h2>
            <p className="xp-panel-note">
              {stock
                ? RIGS[rig].label + ' carries ' + stock.length + ' of ' + PARTS.length + ' connector types.'
                : 'Unfiltered — every part in one flat alphabetical list, like today.'}
            </p>
          </div>
          <div className="fs-ledger">
            <div className="fs-ledger-row fs-ledger-raw">
              <span className="fs-ledger-label">Raw opening</span>
              <MeasurementValue eighths={raw} className="fs-ledger-value" />
            </div>
            <InlineSegmented
              label="Header wood"
              options={WOOD_OPTIONS}
              value={value.headerWood}
              onChange={(v) => set('headerWood', v)}
              trailing={<span className="fs-ledger-value"><MeasurementValue eighths={-Math.round(woodH(value.headerWood) * 8)} /></span>}
            />
            {platePicker('Top plate', 'topPlate')}
            {platePicker('Bottom plate', 'bottomPlate')}
            <InlineSegmented
              label="Footer wood"
              options={WOOD_OPTIONS}
              value={value.footerWood}
              onChange={(v) => set('footerWood', v)}
              trailing={<span className="fs-ledger-value"><MeasurementValue eighths={-Math.round(woodH(value.footerWood) * 8)} /></span>}
            />
            <div className="fs-ledger-row fs-ledger-effective">
              <span className="fs-ledger-label">Required strut length</span>
              <span className="fs-ledger-value fs-ledger-value--big"><MeasurementValue eighths={effectiveEighths} /></span>
            </div>
          </div>
          {offTruck.length > 0 && (
            <p className="xp-panel-note" style={{ color: 'var(--danger-text)' }}>
              ⚠ Selected {offTruck.length === 1 ? 'plate is' : 'plates are'} not on {RIGS[rig].label} — confirm before deploying.
            </p>
          )}
        </section>

        <section className="xp-panel" style={{ flex: 1, minWidth: 380 }}>
          <div className="xp-panel-head">
            <h2 className="xp-panel-title">The rules</h2>
          </div>
          <ul style={{ margin: 0, paddingLeft: '1.2em', font: 'var(--type-body)', color: 'var(--text-secondary)', display: 'flex', flexDirection: 'column', gap: 'var(--space-3)' }}>
            <li><strong style={{ color: 'var(--text-primary)' }}>“Available” section first</strong> — parts on the assigned apparatus, in the usual catalog order. “None” is always available.</li>
            <li><strong style={{ color: 'var(--text-primary)' }}>“Not in inventory” below, at 45% opacity</strong> — visibly demoted, still tappable. Blocking selection would be wrong: crews borrow parts.</li>
            <li><strong style={{ color: 'var(--text-primary)' }}>Selecting an off-truck part warns, never blocks</strong> — the ledger flags it so the deploy step can double-check.</li>
            <li><strong style={{ color: 'var(--text-primary)' }}>Switch apparatus, watch the sort change</strong> — the section split is driven by the same inventory data the Operations board already has.</li>
          </ul>
          <p className="xp-panel-note" style={{ maxWidth: '62ch' }}>
            The grouping, headers, and dimming already exist in <code>VisualGridPicker</code>
            (<code>availableIds</code>) — today only Ops deploy flows pass it. This exploration
            wires it into the deduction ledger (Quick Find + Operations), plus the off-truck
            warning. Photo thumbnails are the Paratech manual figures (see <a href="Idea 384 — Photo Plate Thumbnails.html">#384</a>).
          </p>
        </section>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Page />);
</script>
</body>
</html>
