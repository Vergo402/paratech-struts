<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>#384 — Plate pickers with real photo thumbnails</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="exploration-chrome.css">
<script src="_vendor/react.js"></script>
<script src="exploration-quiet.js"></script>
<script src="_vendor/react-dom.js"></script>
<script src="_ds_bundle.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  .lib-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: var(--space-4) var(--space-3);
  }
  .lib-cell {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--space-2);
    min-width: 0;
    margin: 0;
  }
  .lib-cell img {
    width: 88px;
    height: 88px;
    border-radius: var(--radius-input);
    border: var(--stroke-width) solid var(--surface-stroke);
    background: #fff;
    object-fit: cover;
  }
  .lib-cell figcaption {
    font: var(--type-caption);
    color: var(--text-secondary);
    text-align: center;
    text-wrap: balance;
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { VisualGridPicker, PlateSwatch, MeasurementValue, Segmented } = window.FieldShore;
const { useState, useEffect } = React;

// The real fieldshore-v4 BASE_PLATES catalog. Every id has a plates/<id>.png
// thumbnail extracted from the Paratech Operation & Maintenance Manual — the
// same figures v3 shipped.
const PARTS = [
  { id: 'multi',            name: 'Multi-Base',                    height: 4.2 },
  { id: 'chainwedge',       name: '3/8" Chain Wedge',              height: 4.0 },
  { id: 'vbase',            name: 'V-Base',                        height: 1.9 },
  { id: 'contour',          name: 'Contour Base',                  height: 1.7 },
  { id: 'offsetcone',       name: 'Offset Cone Base',              height: 2.6 },
  { id: 'rubber4',          name: '4" Rubber Base',                height: 2.8 },
  { id: 'rigid6',           name: '6" Rigid Base',                 height: 1.0 },
  { id: 'swivel6',          name: '6" Swivel Base',                height: 1.8 },
  { id: 'hinged6',          name: '6" Hinged Base',                height: 3.2 },
  { id: 'hinged6ring',      name: '6" Hinged Base w/Anchor Ring',  height: 3.2 },
  { id: 'rigid12',          name: '12" Rigid Base',                height: 1.2 },
  { id: 'swivel12',         name: '12" Swivel Base',               height: 2.3 },
  { id: 'hinged12',         name: '12" Hinged Base',               height: 3.4 },
  { id: 'hinged12ring',     name: '12" Hinged Base w/Anchor Ring', height: 3.4 },
  { id: 'angle3x4',         name: '3"x4" Angle Base',              height: 3.4 },
  { id: 'channel4x4',       name: '4"x4" Channel Base',            height: 3.4 },
  { id: 'channelmetric4x6', name: '4.3"x6" Channel Base Metric',   height: 3.4 },
  { id: 'channel6x6',       name: '6"x6" Channel Base',            height: 3.4 },
  { id: 'channelmetric6x7', name: '6.3"x7" Channel Base Metric',   height: 4.2 },
  { id: 'base45',           name: '45° Base',                      height: 5.4 },
  { id: 'rubberangle',      name: 'Angled Rubber Base (ESU)',      height: 2.7 },
  { id: 'elevatorsupport',  name: 'Elevator Support L&R Arm',      height: 6.0 },
  { id: 'springloaded',     name: 'Spring Loaded Connector',       height: 3.9 },
  { id: 'threadedconn',     name: 'Adjustable Threaded Connector', height: 3.5 },
];

// A representative subset for the picker demo (the connectors a crew reaches
// for most) — the full catalog is in the gallery below.
const PICKER_IDS = ['multi', 'swivel6', 'swivel12', 'rigid6', 'hinged6', 'base45', 'vbase', 'contour', 'threadedconn', 'springloaded'];
const byId = Object.fromEntries(PARTS.map((p) => [p.id, p]));

const OPTIONS = [
  { id: 'none', name: 'None' },
  ...PICKER_IDS.map((id) => ({
    id,
    name: byId[id].name,
    sub: <MeasurementValue eighths={-Math.round(byId[id].height * 8)} />,
  })),
];

// Same pattern as shipped PlateThumb: try the photo, fall back to the initial
// swatch on error (id 'none' has no photo).
function PhotoThumb({ opt, size }) {
  const [err, setErr] = useState(false);
  if (opt.id === 'none' || err) return <PlateSwatch name={opt.name} />;
  return (
    <img
      className="fs-swatch fs-swatch--photo"
      style={size !== 40 ? { width: size, height: size } : undefined}
      src={'plates/' + opt.id + '.png'}
      alt=""
      aria-hidden="true"
      onError={() => setErr(true)}
    />
  );
}

function Page() {
  const [current, setCurrent] = useState('multi');
  const [proposed, setProposed] = useState('multi');
  const [size, setSize] = useState('40');

  useEffect(() => {
    const t = setTimeout(() => {
      const trig = document.querySelector('#proposed-picker .fs-picker-trigger');
      if (trig) trig.click();
    }, 400);
    return () => clearTimeout(t);
  }, []);

  return (
    <div className="xp-page">
      <header className="xp-head">
        <span className="xp-eyebrow">FieldShore v4 · design exploration</span>
        <h1 className="xp-title">#384 — Plate pickers: real photo thumbnails</h1>
        <p className="xp-sub">
          Replace the letter/initial swatches in the plate &amp; connector pickers with a photo
          of the physical part. Field users recognize the part by sight — a photo is faster and
          less error-prone under stress than decoding “MB”. Thumbnails are the Paratech
          Operation &amp; Maintenance Manual figures, the same set v3 shipped.
        </p>
        <nav className="xp-links">
          <a href="Design Exploration Queue.html">← All explorations</a>
          <a href="https://github.com/Vergo402/paratech-struts/issues/384" target="_blank" rel="noopener">Issue #384 ↗</a>
        </nav>
      </header>

      <div className="xp-toolbar">
        <span className="xp-toolbar-label">Thumbnail size</span>
        <Segmented
          size="standard"
          options={[{ value: '40', label: '40px (current spec)' }, { value: '56', label: '56px (glove-friendly)' }]}
          value={size}
          onChange={setSize}
          aria-label="Thumbnail size"
        />
      </div>

      <div className="xp-row">
        <section className="xp-panel" style={{ width: 380 }}>
          <span className="xp-tag xp-tag--muted">Today</span>
          <div className="xp-panel-head">
            <h2 className="xp-panel-title">Initial swatches</h2>
            <p className="xp-panel-note">“MB”, “6S”… the operator has to decode an abbreviation
              back into a physical object.</p>
          </div>
          <VisualGridPicker
            label="Top plate"
            options={OPTIONS}
            value={current}
            onSelect={setCurrent}
          />
        </section>

        <section className="xp-panel" style={{ width: 380 }} id="proposed-picker">
          <span className="xp-tag">Proposed</span>
          <div className="xp-panel-head">
            <h2 className="xp-panel-title">Photo thumbnails</h2>
            <p className="xp-panel-note">Same picker, same rows — the swatch is the part’s manual
              figure. Names and deductions stay for confirmation.</p>
          </div>
          <VisualGridPicker
            label="Top plate"
            options={OPTIONS}
            value={proposed}
            onSelect={setProposed}
            renderThumb={(opt) => <PhotoThumb opt={opt} size={+size} />}
          />
        </section>
      </div>

      <section className="xp-panel">
        <div className="xp-panel-head">
          <h2 className="xp-panel-title">The full part library — {PARTS.length} bases &amp; connectors</h2>
          <p className="xp-panel-note">Every entry in the fieldshore-v4 <code>BASE_PLATES</code>
            catalog, with its manual figure. These are the exact assets shipping needs: the
            shipped <code>PlateThumb</code> already requests <code>/plates/&lt;id&gt;.jpg</code>
            per part, so going live is dropping these files into <code>public/plates/</code>.
            Field crews would eventually swap in real photographs of their own gear; the manual
            line-art is the accurate stand-in until then.</p>
        </div>
        <div className="lib-grid">
          {PARTS.map((p) => (
            <figure className="lib-cell" key={p.id}>
              <img src={'plates/' + p.id + '.png'} alt={p.name} />
              <figcaption>{p.name}</figcaption>
            </figure>
          ))}
        </div>
      </section>

      <p className="xp-footer-note">
        Built from the real <code>VisualGridPicker</code> via its existing <code>renderThumb</code>
        hook and the <code>fs-swatch--photo</code> style already in the bundle — no component
        changes needed.
      </p>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Page />);
</script>
</body>
</html>
