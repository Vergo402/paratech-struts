<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>#390 — Individual saw stations: scoped view</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="exploration-chrome.css">
<script src="_vendor/react.js"></script>
<script src="exploration-quiet.js"></script>
<script src="_vendor/react-dom.js"></script>
<script src="_ds_bundle.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  /* Page-glue for the two phone screens; all component chrome is fs-* classes. */
  .st-screen { min-height: 100vh; background: var(--surface-bg); display: flex; flex-direction: column; }
  .st-body { flex: 1; padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-4); }
  .st-topbar {
    display: flex; align-items: center; gap: var(--space-3);
    padding: var(--space-3) var(--space-4);
    border-bottom: var(--stroke-width) solid var(--surface-stroke);
    background: var(--surface-card);
  }
  .st-back {
    appearance: none; border: 0; background: none; cursor: pointer;
    font: var(--type-body-medium); color: var(--accent); padding: var(--space-1) 0;
  }
  .st-topbar h1 { font: var(--type-headline-2); margin: 0; }
  .st-station-card {
    display: flex; flex-direction: column; gap: var(--space-2);
    text-align: left; cursor: pointer;
    background: var(--surface-card);
    border: var(--stroke-width) solid var(--surface-stroke);
    border-radius: var(--radius-card);
    padding: var(--space-4);
    font: inherit; color: inherit;
  }
  .st-station-card:active { background: var(--surface-card-hover); }
  .st-station-letter { font: var(--type-display-2); }
  .st-station-sub { font: var(--type-caption); color: var(--text-secondary); }
  .st-muted-line {
    font: var(--type-caption); color: var(--text-tertiary);
    padding: var(--space-2) var(--space-2) 0;
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const { CuttingControls, MeasurementValue, EmptyState } = window.FieldShore;
const { useState } = React;
const noop = () => {};

const params = new URLSearchParams(location.search);
const isPhone = params.get('screen') === 'phone';

// Shore points in the cutting queue. cutE = pre-computed cut length (eighths),
// same deduction math the shipped station uses (lumber ×2 + wedge).
const spBase = { opId: 'op-1', division: '2', status: 'cutting', deductions: { headerWood: '6x6', footerWood: '6x6', topPlate: 'none', bottomPlate: 'none' } };
const INITIAL = [
{ ...spBase, id: 'sp-22', seq: 22, shoreType: '3-post', area: 'West Wall', measurementEighths: 640, cutE: 540, where: 'Div 2 · West Wall · 3-Post', sawId: 'A', cuttingDone: false },
{ ...spBase, id: 'sp-23', seq: 23, shoreType: 'double-t', area: 'East Stairwell', measurementEighths: 564, cutE: 496, where: 'Div 2 · East Stairwell · Double-T', sawId: 'B', cuttingDone: false },
{ ...spBase, id: 'sp-24', seq: 24, shoreType: 't-shore', area: 'Corridor C', measurementEighths: 752, cutE: 684, where: 'Div 2 · Corridor C · T-Shore', sawId: null, cuttingDone: false },
{ ...spBase, id: 'sp-25', seq: 25, shoreType: '3-post', area: 'Loading Dock', measurementEighths: 588, cutE: 488, where: 'Div 1 · Loading Dock · 3-Post', sawId: null, cuttingDone: false }];

const SAWS = ['A', 'B'];

function heroOf(queue, saw) {return queue.find((sp) => sp.sawId === saw) || null;}
function pendingOf(queue) {return queue.filter((sp) => sp.sawId === null);}

// ── Screen 1: pick your station ──
function StationSelect({ queue, onPick }) {
  const pending = pendingOf(queue);
  return (
    <div className="st-screen">
      <div className="st-topbar"><h1>✂ Cutting Station</h1></div>
      <div className="st-body">
        <p style={{ font: 'var(--type-body)', color: 'var(--text-secondary)', margin: 0 }}>
          You’re assigned to a saw. Pick it — you’ll see only your cut and the shared
          pending list.
        </p>
        {SAWS.map((saw) => {
          const sp = heroOf(queue, saw);
          return (
            <button type="button" className="st-station-card" key={saw} onClick={() => onPick(saw)}>
              <span className="st-station-letter">Saw {saw}</span>
              {sp ?
              <span style={{ font: 'var(--type-body-medium)' }}>
                  Cutting <MeasurementValue eighths={sp.cutE} /> · SP-{sp.seq}
                </span> :

              <span style={{ font: 'var(--type-body-medium)', color: 'var(--text-secondary)' }}>Idle — no cut claimed</span>
              }
              <span className="st-station-sub">{pending.length} waiting in the shared queue</span>
            </button>);

        })}
      </div>
    </div>);

}

// ── Screen 2: the scoped station view ──
function StationView({ saw, queue, setQueue, onBack }) {
  const sp = heroOf(queue, saw);
  const pending = pendingOf(queue);
  const otherBusy = SAWS.filter((s) => s !== saw).map((s) => ({ s, sp: heroOf(queue, s) })).filter((x) => x.sp);

  const markDone = (target) => setQueue((q) => q.map((x) => x.id === target.id ? { ...x, cuttingDone: true } : x));
  const clearDone = (target) => setQueue((q) => q.map((x) => x.id === target.id ? { ...x, cuttingDone: false } : x));
  const sendToRunner = (target) => setQueue((q) => {
    const rest = q.filter((x) => x.id !== target.id);
    const next = rest.find((x) => x.sawId === null);
    return rest.map((x) => next && x.id === next.id ? { ...x, sawId: saw } : x);
  });
  const stepBack = (target) => setQueue((q) => q.filter((x) => x.id !== target.id));

  return (
    <div className="st-screen">
      <div className="st-topbar">
        <button type="button" className="st-back" onClick={onBack}>‹ Stations</button>
        <h1>Saw {saw}</h1>
      </div>
      <div className="st-body">
        <section className="fs-cutstation" aria-label={'Saw ' + saw}>
          {sp ?
          <div className="fs-cutstation-hero" data-sp-id={sp.id} data-saw={saw}>
              <span className="fs-cutstation-hero-badge">Saw {saw} · cut this now</span>
              <p className="fs-cutstation-hero-label">Cut length</p>
              <p className="fs-cutstation-hero-num"><MeasurementValue eighths={sp.cutE} /></p>
              <p className="fs-cutstation-hero-where">{sp.where}</p>
              {sp.cuttingDone && <p className="fs-cutstation-hero-cutdone">✓ Cut done</p>}
              <div className="fs-cutstation-hero-slide">
                <CuttingControls
                sp={sp}
                onMarkCutDone={markDone}
                onClearCutDone={clearDone}
                onSendToRunner={sendToRunner}
                onStepBack={stepBack} />
              
              </div>
            </div> :

          <EmptyState
            variant="all-clear"
            headline={'Saw ' + saw + ' is clear'}
            reason="Nothing claimed and nothing waiting — stand by for the next shore point" />

          }

          <div className="fs-cutstation-upnext" style={{ marginTop: 'var(--space-4)' }}>
            <p className="fs-cutstation-upnext-head">Pending · shared queue</p>
            <div role="list">
              {pending.length === 0 ?
              <p className="fs-cutstation-row-where" style={{ padding: 'var(--space-2)' }}>
                  Nothing waiting — this is the last cut.
                </p> :
              pending.map((p) =>
              <div role="listitem" className="fs-cutstation-row" key={p.id} data-sp-id={p.id}>
                  <span className="fs-cutstation-row-body">
                    <span className="fs-cutstation-row-num"><MeasurementValue eighths={p.cutE} /></span>
                    <span className="fs-cutstation-row-where">{p.where}</span>
                  </span>
                </div>
              )}
            </div>
            {otherBusy.length > 0 &&
            <p className="st-muted-line">
                {otherBusy.map(({ s, sp: osp }) =>
              <span key={s}>Saw {s} is on its own cut (SP-{osp.seq}) — not in your queue.</span>
              )}
              </p>
            }
          </div>
        </section>
      </div>
    </div>);

}

function PhoneApp() {
  const [queue, setQueue] = useState(INITIAL);
  const [saw, setSaw] = useState(null);
  return saw ?
  <StationView saw={saw} queue={queue} setQueue={setQueue} onBack={() => setSaw(null)} /> :
  <StationSelect queue={queue} onPick={setSaw} />;
}

// ── Exploration page ──
function Page() {
  return (
    <div className="xp-page">
      <header className="xp-head">
        <span className="xp-eyebrow">FieldShore v4 · design exploration</span>
        <h1 className="xp-title">#390 — Individual saw stations: scoped view</h1>
        <p className="xp-sub">
          An officer assigned to Saw B should see Saw B’s cut and the shared pending list —
          nothing else. Less to read under gloves, sun, and stress; no risk of cutting a
          length claimed by the other saw.
        </p>
        <nav className="xp-links">
          <a href="Design Exploration Queue.html">← All explorations</a>
          <a href="https://github.com/Vergo402/paratech-struts/issues/390" target="_blank" rel="noopener">Issue #390 ↗</a>
        </nav>
      </header>

      <div className="xp-row">
        <div style={{ display: 'flex', flexDirection: 'column', gap: 'var(--space-3)' }} data-comment-anchor="33eddf82c3-div-160-9">
          <span className="xp-tag">Proposed flow — try it</span>
          <div className="xp-phone">
            <iframe src="?screen=phone" title="Saw station flow"></iframe>
          </div>
        </div>
        <section className="xp-panel" style={{ flex: 1, minWidth: 380 }}>
          <div className="xp-panel-head">
            <h2 className="xp-panel-title">How it works</h2>
          </div>
          <ul style={{ margin: 0, paddingLeft: '1.2em', font: 'var(--type-body)', color: 'var(--text-secondary)', display: 'flex', flexDirection: 'column', gap: 'var(--space-3)' }}>
            <li><strong style={{ color: 'var(--text-primary)' }}>Pick your saw once.</strong> The station screen locks to it; the header always says which saw you are.</li>
            <li><strong style={{ color: 'var(--text-primary)' }}>One hero cut.</strong> The full-width cut card and slide controls are the real <code>CuttingControls</code> — send to runner auto-claims the next pending cut for your saw.</li>
            <li><strong style={{ color: 'var(--text-primary)' }}>Shared pending list stays visible</strong> so you can see workload coming, but the other saw’s claimed cut is reduced to one muted line — you can’t grab it by mistake.</li>
            <li><strong style={{ color: 'var(--text-primary)' }}>Clear = calm.</strong> When your saw has nothing, the all-clear empty state confirms it instead of a blank card.</li>
          </ul>
        </section>
      </div>

      <p className="xp-footer-note">
        Composed from the shipped station vocabulary — <code>fs-cutstation</code> hero and row
        styles, <code>CuttingControls</code>, <code>MeasurementValue</code>, <code>EmptyState</code> —
        so it inherits the existing claim/assign logic (<code>assignSaws</code>) unchanged.
      </p>
    </div>);

}

ReactDOM.createRoot(document.getElementById('root')).render(isPhone ? <PhoneApp /> : <Page />);
</script>
</body>
</html>
