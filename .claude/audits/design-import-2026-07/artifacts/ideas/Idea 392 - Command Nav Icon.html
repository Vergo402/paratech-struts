<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>#392 — Command nav icon: hierarchy tree</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="exploration-chrome.css">
<script src="_vendor/react.js"></script>
<script src="exploration-quiet.js"></script>
<script src="_vendor/react-dom.js"></script>
<script src="_ds_bundle.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  .tabbar {
    display: grid; grid-template-columns: repeat(5, 1fr); align-items: center;
    height: 64px; background: var(--surface-card);
    border-top: var(--stroke-width) solid var(--surface-stroke);
    border-bottom: var(--stroke-width) solid var(--surface-stroke);
    border-radius: 0 0 var(--radius-card) var(--radius-card);
  }
  .tabbar a {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    font: var(--type-label); color: var(--text-tertiary); text-decoration: none;
    min-height: 44px; justify-content: center;
  }
  .tabbar svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .tabbar a.on { color: var(--accent); }

  .cand-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: var(--space-4); }
  .cand {
    display: flex; flex-direction: column; align-items: flex-start; gap: var(--space-3);
    padding: var(--space-4); cursor: pointer; text-align: left; font: inherit; color: inherit;
    background: var(--surface-card);
    border: var(--stroke-width) solid var(--surface-stroke);
    border-radius: var(--radius-card);
  }
  .cand[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-subtle); }
  .cand-glyphs { display: flex; align-items: center; gap: var(--space-4); color: var(--text-primary); }
  .cand-glyphs svg { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .cand h3 { font: var(--type-body-medium); font-weight: 600; margin: 0; }
  .cand p { font: var(--type-caption); color: var(--text-secondary); margin: 0; }
  .phone-strip { width: 390px; border: var(--stroke-width) solid var(--surface-stroke); border-radius: var(--radius-card); overflow: hidden; background: var(--surface-bg); }
  .phone-strip .fill {
    height: 120px; display: flex; align-items: center; justify-content: center;
    font: var(--type-caption); color: var(--text-tertiary);
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

// All candidates are circles / rectangles / lines only.
const GLYPHS = {
  circles2: {
    name: 'A · Circle tree',
    note: 'As drawn in the canvas explorations. Friendly, but circles read “people”, not “positions”.',
    svg: (s) => (
      <svg viewBox="0 0 24 24" width={s} height={s}>
        <circle cx="12" cy="5" r="2.1"/><circle cx="6" cy="18.5" r="2.1"/><circle cx="18" cy="18.5" r="2.1"/>
        <path d="M12 7.1 V12 M6 16.4 V13 H18 V16.4"/>
      </svg>
    ),
  },
  boxes2: {
    name: 'B · Box org chart',
    note: 'Rectangles = position cards, exactly what the Command org chart draws. Recommended.',
    svg: (s) => (
      <svg viewBox="0 0 24 24" width={s} height={s}>
        <rect x="9" y="3" width="6" height="4.6" rx="1"/>
        <rect x="3" y="16.4" width="6" height="4.6" rx="1"/>
        <rect x="15" y="16.4" width="6" height="4.6" rx="1"/>
        <path d="M12 7.6 V12 M6 16.4 V13 H18 V16.4"/>
      </svg>
    ),
  },
  boxes3: {
    name: 'C · Three-branch chart',
    note: 'One IC over three sections — closest to a real ICS structure, busiest at 22px.',
    svg: (s) => (
      <svg viewBox="0 0 24 24" width={s} height={s}>
        <rect x="9.2" y="3" width="5.6" height="4.2" rx="1"/>
        <rect x="2.6" y="17" width="5.6" height="4.2" rx="1"/>
        <rect x="9.2" y="17" width="5.6" height="4.2" rx="1"/>
        <rect x="15.8" y="17" width="5.6" height="4.2" rx="1"/>
        <path d="M12 7.2 V12 M5.4 17 V14 H18.6 V17 M12 12 V17"/>
      </svg>
    ),
  },
  hybrid: {
    name: 'D · IC node + branches',
    note: 'Filled root marks “command sits at the top”. Slightly more ink; strong at a glance.',
    svg: (s) => (
      <svg viewBox="0 0 24 24" width={s} height={s}>
        <circle cx="12" cy="5.2" r="2.4" fill="currentColor" stroke="none"/>
        <rect x="3" y="16.4" width="6" height="4.6" rx="1"/>
        <rect x="15" y="16.4" width="6" height="4.6" rx="1"/>
        <path d="M12 7.6 V12 M6 16.4 V13 H18 V16.4"/>
      </svg>
    ),
  },
};

const OTHER_ICONS = {
  find: <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><line x1="20" y1="20" x2="15.5" y2="15.5"/></svg>,
  ops:  <svg viewBox="0 0 24 24"><rect x="4" y="5" width="4.4" height="14" rx="1"/><rect x="9.8" y="5" width="4.4" height="9" rx="1"/><rect x="15.6" y="5" width="4.4" height="11" rx="1"/></svg>,
  inv:  <svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="13" rx="1.5"/><line x1="4" y1="11" x2="20" y2="11"/><line x1="12" y1="6" x2="12" y2="11"/></svg>,
  set:  <svg viewBox="0 0 24 24"><line x1="4" y1="8.5" x2="20" y2="8.5"/><line x1="4" y1="15.5" x2="20" y2="15.5"/><circle cx="9" cy="8.5" r="2.5"/><circle cx="15" cy="15.5" r="2.5"/></svg>,
};

function TabBar({ cmdGlyph, active }) {
  return (
    <div className="tabbar" role="navigation" aria-label="Primary">
      <a href="#" onClick={(e) => e.preventDefault()} className={active === 'find' ? 'on' : ''}>{OTHER_ICONS.find}<span>Quick Find</span></a>
      <a href="#" onClick={(e) => e.preventDefault()} className={active === 'ops' ? 'on' : ''}>{OTHER_ICONS.ops}<span>Operations</span></a>
      <a href="#" onClick={(e) => e.preventDefault()} className={active === 'cmd' ? 'on' : ''}>{GLYPHS[cmdGlyph].svg(22)}<span>Command</span></a>
      <a href="#" onClick={(e) => e.preventDefault()} className={active === 'inv' ? 'on' : ''}>{OTHER_ICONS.inv}<span>Inventory</span></a>
      <a href="#" onClick={(e) => e.preventDefault()} className={active === 'set' ? 'on' : ''}>{OTHER_ICONS.set}<span>Settings</span></a>
    </div>
  );
}

function Page() {
  const [pick, setPick] = useState('boxes2');
  return (
    <div className="xp-page">
      <header className="xp-head">
        <span className="xp-eyebrow">FieldShore v4 · design exploration</span>
        <h1 className="xp-title">#392 — Command tab: hierarchy-tree icon</h1>
        <p className="xp-sub">
          The Command tab should read as “ICS command structure” at a glance. Four hierarchy
          glyph candidates, previewed live in the real nav context — active and inactive states.
        </p>
        <nav className="xp-links">
          <a href="Design Exploration Queue.html">← All explorations</a>
          <a href="https://github.com/Vergo402/paratech-struts/issues/392" target="_blank" rel="noopener">Issue #392 ↗</a>
        </nav>
      </header>

      <div className="xp-row">
        <div style={{ display: 'flex', flexDirection: 'column', gap: 'var(--space-4)' }}>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 'var(--space-2)' }}>
            <span className="xp-tag">Command active</span>
            <div className="phone-strip">
              <div className="fill">screen content</div>
              <TabBar cmdGlyph={pick} active="cmd" />
            </div>
          </div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 'var(--space-2)' }}>
            <span className="xp-tag xp-tag--muted">Command inactive</span>
            <div className="phone-strip">
              <div className="fill">screen content</div>
              <TabBar cmdGlyph={pick} active="ops" />
            </div>
          </div>
        </div>

        <section className="xp-panel" style={{ flex: 1, minWidth: 420 }}>
          <div className="xp-panel-head">
            <h2 className="xp-panel-title">Candidates — tap to preview</h2>
            <p className="xp-panel-note">Each shown at 22px (nav size) and 16px (compact rail size).
              Stroke weight and corner radius match the existing nav icon set.</p>
          </div>
          <div className="cand-grid">
            {Object.entries(GLYPHS).map(([id, g]) => (
              <button type="button" className="cand" key={id} aria-pressed={pick === id} onClick={() => setPick(id)}>
                <span className="cand-glyphs">{g.svg(32)}{g.svg(22)}{g.svg(16)}</span>
                <h3>{g.name}</h3>
                <p>{g.note}</p>
              </button>
            ))}
          </div>
          <p className="xp-panel-note" style={{ maxWidth: '64ch' }}>
            Recommendation: <strong>B — box org chart</strong>. It mirrors the position cards the
            Command screen actually renders (<code>OrgChart</code> draws rectangles, not circles),
            stays legible at 16px, and is the least ink of the box family.
          </p>
        </section>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Page />);
</script>
</body>
</html>
