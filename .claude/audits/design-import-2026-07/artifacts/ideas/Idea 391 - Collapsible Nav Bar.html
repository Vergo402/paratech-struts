<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>#391 — Collapsible nav bar</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="exploration-chrome.css">
<script src="_vendor/react.js"></script>
<script src="exploration-quiet.js"></script>
<script src="_vendor/react-dom.js"></script>
<script src="_ds_bundle.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  /* ── Phone shell ── */
  .shell { height: 100vh; display: flex; flex-direction: column; background: var(--surface-bg); overflow: hidden; }
  .shell-content { flex: 1; overflow-y: auto; padding: var(--space-4); min-height: 0; }

  .tabbar-wrap { flex: none; position: relative; }
  .tabbar {
    display: grid; grid-template-columns: repeat(5, 1fr); align-items: center;
    height: 64px; background: var(--surface-card);
    border-top: var(--stroke-width) solid var(--surface-stroke);
    transition: height 200ms ease, opacity 150ms ease;
    overflow: hidden;
  }
  .tabbar a {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    font: var(--type-label); color: var(--text-tertiary); text-decoration: none;
    min-height: 44px; justify-content: center;
  }
  .tabbar a svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .tabbar a.on { color: var(--accent); }
  .tabbar-wrap.is-collapsed .tabbar { height: 0; opacity: 0; border-top-width: 0; }
  .tabbar-wrap.is-compact .tabbar { height: 44px; }
  .tabbar-wrap.is-compact .tabbar a span { display: none; }

  /* Pull tab on the nav's top edge */
  .nav-handle {
    position: absolute; top: -18px; left: 50%; transform: translateX(-50%);
    width: 56px; height: 18px; border: var(--stroke-width) solid var(--surface-stroke);
    border-bottom: 0; border-radius: 10px 10px 0 0;
    background: var(--surface-card); cursor: pointer; padding: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-tertiary);
  }
  .nav-handle svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: transform 200ms ease; }
  .tabbar-wrap.is-collapsed .nav-handle svg { transform: rotate(180deg); }

  /* Floating restore pill when fully hidden (auto-hide mode) */
  .nav-pill {
    position: absolute; right: var(--space-4); bottom: var(--space-4);
    height: 44px; padding: 0 var(--space-4);
    display: flex; align-items: center; gap: var(--space-2);
    border: var(--stroke-width) solid var(--surface-stroke); border-radius: 22px;
    background: var(--surface-elevated); box-shadow: var(--shadow-sheet);
    font: var(--type-body-medium); color: var(--text-secondary); cursor: pointer;
  }

  /* ── Desktop rail ── */
  .rail-demo { display: flex; height: 560px; border: var(--stroke-width) solid var(--surface-stroke); border-radius: var(--radius-card); overflow: hidden; background: var(--surface-bg); }
  .rail {
    flex: none; width: 200px; display: flex; flex-direction: column; gap: var(--space-1);
    padding: var(--space-3); background: var(--surface-card);
    border-right: var(--stroke-width) solid var(--surface-stroke);
    transition: width 200ms ease;
  }
  .rail.is-slim { width: 64px; }
  .rail a {
    display: flex; align-items: center; gap: var(--space-3);
    padding: 10px 12px; border-radius: var(--radius-button);
    font: var(--type-body-medium); color: var(--text-secondary); text-decoration: none;
    white-space: nowrap; overflow: hidden; min-height: 44px;
  }
  .rail a svg { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .rail a.on { color: var(--accent); background: var(--accent-subtle); }
  .rail.is-slim a span { display: none; }
  .rail-toggle {
    margin-top: auto; appearance: none; cursor: pointer;
    display: flex; align-items: center; gap: var(--space-3);
    padding: 10px 12px; border-radius: var(--radius-button); border: 0;
    background: none; font: var(--type-body-medium); color: var(--text-tertiary);
    white-space: nowrap; overflow: hidden; min-height: 44px;
  }
  .rail-toggle svg { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; transition: transform 200ms ease; }
  .rail.is-slim .rail-toggle svg { transform: rotate(180deg); }
  .rail.is-slim .rail-toggle span { display: none; }
  .rail-main { flex: 1; overflow-y: auto; padding: var(--space-5); min-width: 0; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { CuttingStation, Segmented } = window.FieldShore;
const { useState, useRef, useEffect } = React;
const noop = () => {};

const params = new URLSearchParams(location.search);
const isPhone = params.get('screen') === 'phone';
const phoneMode = params.get('mode') || 'handle';

const ICONS = {
  find: <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><line x1="20" y1="20" x2="15.5" y2="15.5"/></svg>,
  ops:  <svg viewBox="0 0 24 24"><rect x="4" y="5" width="4.4" height="14" rx="1"/><rect x="9.8" y="5" width="4.4" height="9" rx="1"/><rect x="15.6" y="5" width="4.4" height="11" rx="1"/></svg>,
  cmd:  <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.1"/><circle cx="6" cy="18.5" r="2.1"/><circle cx="18" cy="18.5" r="2.1"/><path d="M12 7.1 V12 M6 16.4 V13 H18 V16.4"/></svg>,
  inv:  <svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="13" rx="1.5"/><line x1="4" y1="11" x2="20" y2="11"/><line x1="12" y1="6" x2="12" y2="11"/></svg>,
  set:  <svg viewBox="0 0 24 24"><line x1="4" y1="8.5" x2="20" y2="8.5"/><line x1="4" y1="15.5" x2="20" y2="15.5"/><circle cx="9" cy="8.5" r="2.5"/><circle cx="15" cy="15.5" r="2.5"/></svg>,
};
const TABS = [['find', 'Quick Find'], ['ops', 'Operations'], ['cmd', 'Command'], ['inv', 'Inventory'], ['set', 'Settings']];

const spBase = { opId: 'op-1', division: '2', status: 'cutting', shoreType: '3-post', deductions: { headerWood: '6x6', footerWood: '6x6', topPlate: 'none', bottomPlate: 'none' }, cuttingDone: false };
const QUEUE = [640, 564, 752, 588, 620, 700].map((m, i) => ({
  ...spBase, id: 'sp-' + (22 + i), seq: 22 + i, measurementEighths: m,
  area: ['West Wall', 'East Stairwell', 'Corridor C', 'Loading Dock', 'North Bay', 'Atrium'][i],
  cuttingStartedAt: (i + 1) * 1000,
}));

function Station() {
  return (
    <CuttingStation
      queue={QUEUE} sent={[]}
      onMarkCutDone={noop} onClearCutDone={noop} onSendToRunner={noop} onStepBack={noop}
    />
  );
}

function TabBar({ active }) {
  return (
    <div className="tabbar" role="navigation" aria-label="Primary">
      {TABS.map(([k, l]) => (
        <a key={k} href="#" onClick={(e) => e.preventDefault()} className={k === active ? 'on' : ''}>
          {ICONS[k]}<span>{l}</span>
        </a>
      ))}
    </div>
  );
}

// ── Phone shell (in iframe) ──
function PhoneShell() {
  const [collapsed, setCollapsed] = useState(false);
  const [compact, setCompact] = useState(false);
  const [hidden, setHidden] = useState(false);
  const lastY = useRef(0);

  const onScroll = (e) => {
    if (phoneMode !== 'autohide') return;
    const y = e.target.scrollTop;
    const d = y - lastY.current;
    if (d > 6 && y > 40) setHidden(true);
    else if (d < -6) setHidden(false);
    lastY.current = y;
  };

  const wrapCls = 'tabbar-wrap' +
    ((phoneMode === 'handle' && collapsed) || (phoneMode === 'autohide' && hidden) ? ' is-collapsed' : '') +
    (phoneMode === 'compact' && compact ? ' is-compact' : '');

  return (
    <div className="shell">
      <div className="shell-content" onScroll={onScroll}>
        <Station />
      </div>
      <div className={wrapCls}>
        {(phoneMode === 'handle' || phoneMode === 'compact') && (
          <button
            type="button" className="nav-handle"
            aria-label={phoneMode === 'handle' ? (collapsed ? 'Show navigation' : 'Hide navigation') : (compact ? 'Expand navigation' : 'Shrink navigation')}
            onClick={() => phoneMode === 'handle' ? setCollapsed(!collapsed) : setCompact(!compact)}
          >
            <svg viewBox="0 0 24 24"><path d="M6 14l6-5 6 5"/></svg>
          </button>
        )}
        <TabBar active="ops" />
      </div>
      {phoneMode === 'autohide' && hidden && (
        <button type="button" className="nav-pill" onClick={() => setHidden(false)}>
          <svg style={{ width: 16, height: 16, fill: 'none', stroke: 'currentColor', strokeWidth: 2, strokeLinecap: 'round' }} viewBox="0 0 24 24"><path d="M6 14l6-5 6 5"/></svg>
          Nav
        </button>
      )}
    </div>
  );
}

// ── Exploration page ──
function Page() {
  const [mode, setMode] = useState('handle');
  const [slim, setSlim] = useState(true);
  const NOTES = {
    handle: 'A pull-tab on the nav’s top edge. One tap hides the whole bar (reclaims 64px); the tab stays reachable to bring it back. Explicit and predictable — nothing moves unless you move it.',
    autohide: 'Scroll down and the nav gets out of the way; scroll up (or tap the pill) and it returns. Zero taps, but the bar moves on its own — riskier under gloves.',
    compact: 'The tab shrinks the bar to icons-only (44px, still full hit-targets) instead of hiding it. Middle ground: reclaims 20px but navigation never disappears.',
  };
  return (
    <div className="xp-page">
      <header className="xp-head">
        <span className="xp-eyebrow">FieldShore v4 · design exploration</span>
        <h1 className="xp-title">#391 — Collapsible nav bar</h1>
        <p className="xp-sub">
          Dense field screens (Operations board, Command, Cutting Station) need maximum vertical
          room. Three ways to let the primary nav get out of the way — shown on the real Cutting
          Station, the densest screen we have.
        </p>
        <nav className="xp-links">
          <a href="Design Exploration Queue.html">← All explorations</a>
          <a href="https://github.com/Vergo402/paratech-struts/issues/391" target="_blank" rel="noopener">Issue #391 ↗</a>
        </nav>
      </header>

      <div className="xp-toolbar">
        <span className="xp-toolbar-label">Phone behavior</span>
        <Segmented
          size="standard"
          options={[
            { value: 'handle', label: 'A · Pull-tab' },
            { value: 'autohide', label: 'B · Auto-hide on scroll' },
            { value: 'compact', label: 'C · Icons-only compact' },
          ]}
          value={mode}
          onChange={setMode}
          aria-label="Phone nav behavior"
        />
      </div>

      <div className="xp-row">
        <div style={{ display: 'flex', flexDirection: 'column', gap: 'var(--space-3)' }}>
          <span className="xp-tag">Phone · bottom nav</span>
          <div className="xp-phone">
            <iframe key={mode} src={'?screen=phone&mode=' + mode} title="Phone shell with collapsible nav"></iframe>
          </div>
        </div>
        <section className="xp-panel" style={{ flex: 1, minWidth: 380 }}>
          <div className="xp-panel-head">
            <h2 className="xp-panel-title">{{ handle: 'A · Pull-tab', autohide: 'B · Auto-hide on scroll', compact: 'C · Icons-only compact' }[mode]}</h2>
            <p className="xp-panel-note">{NOTES[mode]}</p>
          </div>
          <p className="xp-panel-note" style={{ maxWidth: '60ch' }}>
            Recommendation: <strong>A (pull-tab)</strong> as the default — field doctrine favors
            controls that only move when deliberately operated. B suits read-heavy screens like
            Past Operations; C is a good desktop analogue (see rail below).
          </p>
        </section>
      </div>

      <section className="xp-panel">
        <div className="xp-panel-head" style={{ flexDirection: 'row', display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', gap: 'var(--space-4)' }}>
          <h2 className="xp-panel-title">Desktop · side rail collapses to icons</h2>
          <span className="xp-panel-note">Same principle, same toggle position (bottom of rail).</span>
        </div>
        <div className="rail-demo">
          <nav className={'rail' + (slim ? ' is-slim' : '')} aria-label="Primary">
            {TABS.map(([k, l]) => (
              <a key={k} href="#" onClick={(e) => e.preventDefault()} className={k === 'ops' ? 'on' : ''}>
                {ICONS[k]}<span>{l}</span>
              </a>
            ))}
            <button type="button" className="rail-toggle" onClick={() => setSlim(!slim)}>
              <svg viewBox="0 0 24 24"><path d="M14 6l-5 6 5 6"/></svg>
              <span>Collapse</span>
            </button>
          </nav>
          <div className="rail-main">
            <Station />
          </div>
        </div>
      </section>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(isPhone ? <PhoneShell /> : <Page />);
</script>
</body>
</html>
