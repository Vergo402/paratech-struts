  <rect width="1000" height="1000" fill="#1C1F23"/>
  <g transform="translate(0,84)">
  <text x="60" y="64" font-size="20" letter-spacing="2" fill="#6E6D6A">FIELDSHORE v4 · LOGO &amp; MARK</text>

  <!-- hero emblem -->
  <use href="#emb" transform="translate(250,150) scale(2.08)"/>

  <!-- wordmark -->
  <text x="500" y="560" text-anchor="middle" font-size="96" letter-spacing="-3" fill="#F0EFEC"><tspan font-weight="500">Field</tspan><tspan font-weight="800">Shore</tspan></text>

  <!-- the mark in use -->
  <g transform="translate(372,648)">
    <rect width="120" height="120" rx="22" fill="#1C1F23" stroke="#2E333B" stroke-width="2"/>
    <use href="#emb" transform="translate(12,33) scale(0.4)"/>
    <text x="60" y="146" text-anchor="middle" font-size="15" fill="#8A8A86">app icon</text>
  </g>
  <g transform="translate(518,648)">
    <rect width="120" height="120" rx="22" fill="#1C1F23" stroke="#2E333B" stroke-width="2"/>
    <use href="#mono" transform="translate(14,35) scale(0.53)"/>
    <text x="60" y="146" text-anchor="middle" font-size="15" fill="#8A8A86">favicon · mono</text>
  </g>
  </g>
</svg>
